[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-ad"
version = "0.1.0"
description = "Behavioural anomaly detection in agentic tool-use sequences (MSc thesis, ELTE IK)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    # Task definitions (user tasks, injection tasks, ground truth). Pinned to the
    # version matching the recorded-runs commit in configs/data.yaml.
    "agentdojo==0.1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Only needed for the LSTM autoencoder rung of the model ladder.
nn = ["torch>=2.2"]

[project.scripts]
trace-ad-download = "trace_ad.data.download:main"
trace-ad-parse = "trace_ad.data.agentdojo_runs:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
